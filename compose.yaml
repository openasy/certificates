# Certificates. Every TLS certificate you send, or that public endpoints present, with its expiry and warnings (ADR 0046).
#
#   openssl rand -hex 32 > openasy-kek   # certificates's key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs certificates | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  certificates:
    image: ghcr.io/openasy/certificates:0.3.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - certificates-data:/data # SQLite database: certificates, where they were seen, and endpoints
      # - ./inventory:/config/inventory:ro   # the install's endpoints, shared with Uptime
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open Certificates at; with a TLS proxy in front, its https:// URL.
      CERTIFICATES_PUBLIC_URL: ${CERTIFICATES_PUBLIC_URL:-http://localhost:8080}
      # For cron jobs, CI and collectors: it can send certificates and nothing else. Or use an API token with the editor role from Settings.
      CERTIFICATES_INGEST_TOKEN: ${CERTIFICATES_INGEST_TOKEN:-}
      # Endpoints from the endpoints file, the same file Uptime reads (ADR 0052):
      # OPENASY_ENDPOINTS: /config/inventory/endpoints.yaml
      # Expiry thresholds in days; give Uptime the same value:
      # OPENASY_CERT_WARN_DAYS: 30,14,7,1
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: certificates
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  certificates-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
